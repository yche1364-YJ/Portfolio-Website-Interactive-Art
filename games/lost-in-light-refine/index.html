<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost in Light · 粉彩俯視原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#202445;color:#f3e5cb;font:14px system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-family:'Chalkboard SE',system-ui,sans-serif;font-weight:500;margin:0;font-size:27px}header p{color:#c9c2d7;font-size:12px;line-height:1.8;max-width:620px;margin:8px 0}.eyebrow{font-size:10px;letter-spacing:.13em;color:#d0bfa2}canvas{display:block;width:100%;aspect-ratio:1586/992;touch-action:manipulation;cursor:crosshair;border-radius:6px;margin:14px 0 16px}button{font:inherit;border:1px solid #a09ab077;background:#3a3c60;color:#eee0c6;border-radius:9px 6px 10px 7px;padding:11px 16px;min-height:44px;cursor:pointer}button:hover{background:#4a4c73}button[aria-pressed=true]{background:#e9ce87;color:#33344e;border-color:#e9ce87}button:focus-visible{outline:3px solid #efcf78;outline-offset:3px}button.primary{background:#b6ccb0;color:#2a3b3c}.tools{display:flex;gap:9px;flex-wrap:wrap}.spacer{flex:1}#status{font-size:13px;line-height:1.8;min-height:46px;margin:14px 0 4px;color:#eddfbc}.help{display:flex;gap:24px;flex-wrap:wrap;font-size:11px;line-height:1.8;color:#b9b2ca;padding-top:12px;border-top:1px solid #7f78924a}.canvas-wrap{position:relative}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#272846;color:#ecd498}#loading[hidden]{display:none}@media(max-width:650px){main{padding:14px}header{display:block}h1{font-size:23px}.eyebrow{margin-top:10px}.tools{gap:7px}button{font-size:12px;padding:10px 12px}.spacer{display:none}.help{gap:6px}}
</style></head><body><main><header><div><h1>Lost in Light</h1><p>放一盞燈，轉一面鏡子，讓小球沿著亮路彈跳回家。</p></div><span class="eyebrow">2D TOP-DOWN · PASTEL STUDY</span></header><div class="canvas-wrap"><canvas id="board" width="1586" height="992" tabindex="0" aria-label="遊戲地圖：先選放燈或放鏡子，再點道路放置；再點已有物件可旋轉。也可用左右方向鍵選位置，Enter 放置。"></canvas><div id="loading">正在準備夜晚的小路……</div></div><div class="tools"><button data-tool="lamp" aria-pressed="true">放燈 <span id="lamp-count"></span></button><button data-tool="mirror" aria-pressed="false">放鏡子 <span id="mirror-count"></span></button><button data-tool="erase" aria-pressed="false">移除</button><button id="demo">看接光示範</button><span class="spacer"></span><button id="walk" class="primary">讓小球回家 →</button><button id="reset">重新開始</button></div><p id="status" role="status" aria-live="polite"></p><div class="help"><span>點道路放置物件；再點一次，旋轉燈或鏡子。</span><span>暖黃路面＝已照亮；淡紫路面＝還沒接到光。</span><span>最多 2 盞燈、3 面鏡子。小球遇到黑路會停下來。</span></div></main><script src="game.js"></script></body></html>
